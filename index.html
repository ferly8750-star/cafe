
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenuLink | Menu Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>☕ MenuLink</h1>
    <p>Menu digital kafe favoritmu</p>
  </header>

  <main>
    <input
      type="text"
      id="search"
      placeholder="Cari makanan atau minuman..."
    >

    <h2>Daftar Menu</h2>
    <section id="menu" class="menu-grid"></section>

    <h2>🛒 Keranjang Pesanan</h2>
    <ul id="cart"></ul>

    <h3>Total: <span id="total">Rp0</span></h3>
    <button id="checkout">Buat Pesanan</button>
    <p id="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
